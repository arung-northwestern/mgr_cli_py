[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mgrcli"
version = "0.1.0"
description = "A command-line interface for analyzing Metal-Organic Frameworks (MOFs)"
authors = [
    {name = "MOF Analysis Team", email = ""},
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["mof", "metal-organic-frameworks", "materials-analysis", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0,<2.4",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "plotly>=5.20",
    "ase>=3.22",
    "pyvista>=0.43",
    "matplotlib>=3.3",
    "streamlit>=1.32",
    "dask[distributed]>=2023.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mgrcli = "mgrcli.cli:main"

[tool.maturin]
python-source = "python_cli"
module-name = "mgrcli_rust"
bindings = "pyo3"
