[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mgrcli"
version = "0.1.0"
description = "A command-line interface for analyzing Metal-Organic Frameworks (MOFs)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["mof", "metal-organic-frameworks", "materials-analysis", "cli"]
authors = [
    {name = "MOF Analysis Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20.0,<2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mgrcli = "mgrcli.cli:main"

[tool.maturin]
module-name = "mgrcli_rust"
bindings = "pyo3"
