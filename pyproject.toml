[build-system]
# Maturin 1.12+ errors when python-source is set and python_cli/mgrcli_rust/
# does not exist. Keep the Rust extension a top-level module (import mgrcli_rust).
# packaging/mgrcli_pep517.py copies mgr_src/mgr into that python-source tree
# for the duration of a wheel build so both packages land in the wheel.
requires = ["maturin>=1.8,<1.12"]
build-backend = "mgrcli_pep517"
backend-path = ["packaging"]

[project]
name = "mgrcli"
version = "2026.05.16.0"
description = "A command-line interface for analyzing Metal-Organic Frameworks (MOFs)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "BSD-3-Clause"}
keywords = ["mof", "metal-organic-frameworks", "materials-analysis", "cli"]
authors = [
    {name = "Arun Gopalan"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # Core CLI + Streamlit
    "numpy>=1.20.0,<3",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "plotly>=5.20",
    "ase>=3.22",
    "pyvista>=0.43",
    "matplotlib>=3.3",
    "streamlit>=1.32",
    "dask[distributed]>=2023.0",
    "pandas>=1.5",
    # Used by mgr_src (aligned with mofography install list where applicable)
    "pymatgen>=2023.1,<2026",
    "networkx>=3.0",
    "tqdm>=4.64",
    "aiohttp>=3.9",
    "icecream>=2.1",
    "sparse>=0.14",
    "scikit-learn>=1.2",
    "rich>=13.0",
    "trimesh>=3.23",
    "furl>=2.1",
    "requests>=2.28",
    "freud-analysis>=2.13",
    "kaleido>=0.2.1",
    # mgr.analyze imports rdkit at package import time.
    "rdkit>=2024.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
mgrcli = "mgrcli.cli:main"

[tool.maturin]
manifest-path = "mgr_src/mgrcli_rust/Cargo.toml"
module-name = "mgrcli_rust"
bindings = "pyo3"
# python_cli/mgr is created by the PEP 517 backend from mgr_src/mgr.
# It is not a second source of truth; do not edit files under python_cli/mgr.
python-source = "python_cli"
python-packages = ["mgrcli", "mgr"]
profile = "release"
